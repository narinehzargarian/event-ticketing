# SQL Server for local development and tests. The password is only for this throwaway container.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: LocalDev_Passw0rd!
    ports:
      - "1434:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'LocalDev_Passw0rd!' -Q 'SELECT 1' || exit 1"]
      interval: 5s
      retries: 40
      start_period: 15s
