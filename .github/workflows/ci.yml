name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: LocalDev_Passw0rd!
        ports:
          - 1434:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'LocalDev_Passw0rd!' -Q 'SELECT 1'"
          --health-interval 5s
          --health-retries 40
          --health-start-period 15s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Check for vulnerable packages
        run: |
          dotnet restore
          ! dotnet list package --vulnerable --include-transitive | grep -E "Critical|High"
      - name: Build
        run: dotnet build --no-restore -warnaserror
      - name: Test against real SQL Server
        run: dotnet test --no-build
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build the web app
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Start the API
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          nohup dotnet run --project src/Ticketing.Api --no-build --urls http://localhost:5080 > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5080/health && break; sleep 2; done
          curl -sf http://localhost:5080/health
      - name: Run browser tests
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Show API log on failure
        if: failure()
        run: tail -50 api.log
